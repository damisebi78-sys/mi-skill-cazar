<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9FAFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0FDF4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <!-- Header Title -->
  <g transform="translate(960, 80)">
    <text x="0" y="0" font-size="56" font-weight="bold" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">
      Cómo Funciona Ohana
    </text>
    <text x="0" y="50" font-size="28" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif">
      3 Ingredientes Científicos = Energía Real
    </text>
  </g>

  <!-- PILLAR 1: ADAPTÓGENOS -->
  <g transform="translate(280, 250)" filter="url(#shadow)">
    <!-- Card background -->
    <rect x="0" y="0" width="320" height="580" rx="20" fill="#FFFFFF" stroke="#34D399" stroke-width="2"/>

    <!-- Color top bar -->
    <rect x="0" y="0" width="320" height="80" rx="20" fill="url(#greenGradient)"/>

    <!-- Icon circle -->
    <circle cx="160" cy="140" r="70" fill="#F0FDF4" stroke="#10B981" stroke-width="3"/>
    <text x="160" y="155" font-size="60" text-anchor="middle">🧬</text>

    <!-- Title -->
    <text x="160" y="250" font-size="28" font-weight="bold" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif">
      Adaptógenos
    </text>

    <!-- Description -->
    <text x="20" y="310" font-size="16" fill="#4B5563" font-family="Arial, sans-serif" font-weight="bold">
      Calman tu Cortisol
    </text>
    <text x="20" y="345" font-size="14" fill="#6B7280" font-family="Arial, sans-serif">
      Reducen el estrés y preparan tu cuerpo para energía sostenida
    </text>

    <!-- Timeline -->
    <rect x="30" y="410" width="260" height="8" rx="4" fill="#E5E7EB"/>
    <rect x="30" y="410" width="130" height="8" rx="4" fill="#10B981"/>

    <!-- Time label -->
    <text x="160" y="450" font-size="14" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-weight="bold">
      Primeras 24-48 horas
    </text>

    <!-- Benefit tags -->
    <g transform="translate(30, 480)">
      <rect x="0" y="0" width="260" height="40" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1"/>
      <text x="130" y="27" font-size="14" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-weight="bold">
        ✓ Menos ansiedad y estrés
      </text>
    </g>
  </g>

  <!-- ARROW -->
  <g transform="translate(680, 500)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#D1D5DB" stroke-width="3"/>
    <polygon points="60,0 50,-8 50,8" fill="#D1D5DB"/>
  </g>

  <!-- PILLAR 2: B-COMPLEX -->
  <g transform="translate(800, 250)" filter="url(#shadow)">
    <!-- Card background -->
    <rect x="0" y="0" width="320" height="580" rx="20" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2"/>

    <!-- Color top bar -->
    <rect x="0" y="0" width="320" height="80" rx="20" fill="url(#blueGradient)"/>

    <!-- Icon circle -->
    <circle cx="160" cy="140" r="70" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3"/>
    <text x="160" y="155" font-size="60" text-anchor="middle">⚡</text>

    <!-- Title -->
    <text x="160" y="250" font-size="28" font-weight="bold" text-anchor="middle" fill="#3B82F6" font-family="Arial, sans-serif">
      B-Complex
    </text>

    <!-- Description -->
    <text x="20" y="310" font-size="16" fill="#4B5563" font-family="Arial, sans-serif" font-weight="bold">
      Activa Metabolismo
    </text>
    <text x="20" y="345" font-size="14" fill="#6B7280" font-family="Arial, sans-serif">
      Convierte nutrientes en energía disponible para tu cuerpo
    </text>

    <!-- Timeline -->
    <rect x="30" y="410" width="260" height="8" rx="4" fill="#E5E7EB"/>
    <rect x="30" y="410" width="195" height="8" rx="4" fill="#3B82F6"/>

    <!-- Time label -->
    <text x="160" y="450" font-size="14" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-weight="bold">
      Primeras 48-72 horas
    </text>

    <!-- Benefit tags -->
    <g transform="translate(30, 480)">
      <rect x="0" y="0" width="260" height="40" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
      <text x="130" y="27" font-size="14" text-anchor="middle" fill="#3B82F6" font-family="Arial, sans-serif" font-weight="bold">
        ✓ Energía constante y real
      </text>
    </g>
  </g>

  <!-- ARROW -->
  <g transform="translate(1200, 500)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#D1D5DB" stroke-width="3"/>
    <polygon points="60,0 50,-8 50,8" fill="#D1D5DB"/>
  </g>

  <!-- PILLAR 3: MAGNESIO -->
  <g transform="translate(1320, 250)" filter="url(#shadow)">
    <!-- Card background -->
    <rect x="0" y="0" width="320" height="580" rx="20" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/>

    <!-- Color top bar -->
    <rect x="0" y="0" width="320" height="80" rx="20" fill="url(#amberGradient)"/>

    <!-- Icon circle -->
    <circle cx="160" cy="140" r="70" fill="#FFFBEB" stroke="#F59E0B" stroke-width="3"/>
    <text x="160" y="155" font-size="60" text-anchor="middle">🌿</text>

    <!-- Title -->
    <text x="160" y="250" font-size="28" font-weight="bold" text-anchor="middle" fill="#F59E0B" font-family="Arial, sans-serif">
      Magnesio
    </text>

    <!-- Description -->
    <text x="20" y="310" font-size="16" fill="#4B5563" font-family="Arial, sans-serif" font-weight="bold">
      Relaja Sin Dormir
    </text>
    <text x="20" y="345" font-size="14" fill="#6B7280" font-family="Arial, sans-serif">
      Mantiene la calma mientras potencia tu energía física
    </text>

    <!-- Timeline -->
    <rect x="30" y="410" width="260" height="8" rx="4" fill="#E5E7EB"/>
    <rect x="30" y="410" width="260" height="8" rx="4" fill="#F59E0B"/>

    <!-- Time label -->
    <text x="160" y="450" font-size="14" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-weight="bold">
      Día 1-3 (Efecto Completo)
    </text>

    <!-- Benefit tags -->
    <g transform="translate(30, 480)">
      <rect x="0" y="0" width="260" height="40" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
      <text x="130" y="27" font-size="14" text-anchor="middle" fill="#F59E0B" font-family="Arial, sans-serif" font-weight="bold">
        ✓ Concentración + Calma
      </text>
    </g>
  </g>

  <!-- RESULT SECTION -->
  <g transform="translate(960, 900)">
    <!-- Result box -->
    <rect x="-400" y="0" width="800" height="120" rx="15" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="2"/>

    <!-- Result text -->
    <text x="0" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif">
      Resultado: Energía Real en 48-72 Horas
    </text>
    <text x="0" y="85" font-size="18" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif">
      Sin crash • Sin ansiedad • Sin insomnio • 100% Natural
    </text>
  </g>
</svg>